<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>400 Photo Grid</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #fff;
      --text: #172033;
      --muted: #6b7280;
      --line: #dfe3ea;
      --shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 248, 251, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    .grid-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
      overflow: auto;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(20, minmax(42px, 1fr));
      gap: 3px;
      min-width: 900px;
      user-select: none;
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid #e4e7ec;
      background: #fbfcfe;
      overflow: hidden;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #c3c9d3;
      font-size: 11px;
    }

    .cell.filled .placeholder { display: none; }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 700px) {
      main { padding-left: 10px; padding-right: 10px; }
      .grid-shell { border-radius: 12px; }
    }
  </style>
</head>
<body>
<header>
  <div class="toolbar">
    <div>
      <h1>400 Photo Grid</h1>
      <p class="meta" id="updated">Loading latest grid...</p>
    </div>
  </div>
</header>

<main>
  <div class="grid-shell">
    <div id="grid" aria-label="20 by 20 photo grid"></div>
  </div>
  <div class="status" id="status">0 / 400 squares filled</div>
</main>

<script>
(() => {
  const TOTAL = 400;
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const updated = document.getElementById('updated');
  const photos = new Array(TOTAL).fill(null);

  function buildGrid() {
    for (let i = 0; i < TOTAL; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.title = `Square ${i + 1}`;

      const placeholder = document.createElement('div');
      placeholder.className = 'placeholder';
      placeholder.textContent = '+';
      cell.appendChild(placeholder);

      grid.appendChild(cell);
    }
  }

  function renderCell(index) {
    const cell = grid.children[index];
    if (!cell) return;

    const existingImg = cell.querySelector('img');
    if (existingImg) existingImg.remove();

    if (photos[index]) {
      const img = document.createElement('img');
      img.src = photos[index];
      img.alt = `Photo in square ${index + 1}`;
      cell.prepend(img);
      cell.classList.add('filled');
    } else {
      cell.classList.remove('filled');
    }
  }

  function renderAll() {
    for (let i = 0; i < TOTAL; i++) renderCell(i);
    const filled = photos.filter(Boolean).length;
    status.textContent = `${filled} / ${TOTAL} squares filled`;
  }

  function formatDate(value) {
    if (!value) return 'No photos have been published yet.';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'Latest published grid';
    return `Updated ${date.toLocaleString()}`;
  }

  async function loadPublishedGrid() {
    try {
      const res = await fetch(`grid-data.json?v=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Could not load grid-data.json: ${res.status}`);
      const data = await res.json();
      if (!data || !Array.isArray(data.photos)) throw new Error('Invalid grid data');

      for (let i = 0; i < TOTAL; i++) photos[i] = data.photos[i] || null;
      updated.textContent = formatDate(data.updatedAt);
      renderAll();
    } catch (err) {
      console.error(err);
      updated.textContent = 'The latest grid could not be loaded.';
    }
  }

  buildGrid();
  loadPublishedGrid();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>400 Photo Grid Editor</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #fff;
      --text: #172033;
      --muted: #6b7280;
      --line: #dfe3ea;
      --accent: #2f6fed;
      --danger: #d64545;
      --success: #238636;
      --warning: #b7791f;
      --shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 248, 251, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #a8b0bd;
    }

    .save-dot.saved { background: var(--success); }
    .save-dot.saving { background: var(--warning); }
    .save-dot.error { background: var(--danger); }

    .publish-error {
      display: none;
      max-width: 760px;
      margin-top: 8px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .publish-error.visible { display: block; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, input {
      font: inherit;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(23, 32, 51, .04);
    }

    button:hover {
      border-color: #bcc5d2;
      transform: translateY(-1px);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button.danger { color: var(--danger); }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    details {
      margin-bottom: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(23, 32, 51, .05);
    }

    summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 700;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
      padding: 0 14px 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: white;
      font-size: 13px;
    }

    .setting-actions {
      align-self: end;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
      overflow: auto;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(20, minmax(42px, 1fr));
      gap: 3px;
      min-width: 900px;
      user-select: none;
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid #e4e7ec;
      background: #fbfcfe;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .cell:hover {
      border-color: #aeb8c7;
      z-index: 1;
      box-shadow: inset 0 0 0 1px rgba(47, 111, 237, .15);
    }

    .cell.drag-over {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
      z-index: 2;
    }

    .cell.dragging { opacity: .35; }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #c3c9d3;
      font-size: 11px;
      pointer-events: none;
    }

    .cell.filled .placeholder { display: none; }

    .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      padding: 0;
      display: none;
      place-items: center;
      border-radius: 999px;
      border: 0;
      background: rgba(18, 24, 38, .78);
      color: white;
      font-size: 15px;
      line-height: 1;
      box-shadow: none;
      z-index: 3;
    }

    .cell.filled:hover .remove { display: grid; }

    .remove:hover {
      background: rgba(214, 69, 69, .95);
      transform: none;
    }

    .status, .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .hint { font-size: 12px; margin-top: 8px; }
    input[type=file] { display: none; }

    @media (max-width: 980px) {
      .settings { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 700px) {
      .actions, .settings { width: 100%; }
      .actions button, .setting-actions button { flex: 1; }
      .settings { grid-template-columns: 1fr; }
      main { padding-left: 10px; padding-right: 10px; }
      .grid-shell { border-radius: 12px; }
    }
  </style>
</head>
<body>
<header>
  <div class="toolbar">
    <div class="title-wrap">
      <h1>400 Photo Grid Editor</h1>
      <p>Click a square to add a photo. Drag filled squares to rearrange.</p>
      <div class="save-state">
        <span id="saveDot" class="save-dot"></span>
        <span id="saveText">Loading saved grid...</span>
      </div>
      <div id="publishError" class="publish-error" role="status"></div>
    </div>

    <div class="actions">
      <button id="publishBtn" class="primary">Publish Now</button>
      <button id="exportBtn">Export Backup</button>
      <button id="importBtn">Import Backup</button>
      <button id="clearBtn" class="danger">Clear All</button>
    </div>
  </div>
</header>

<main>
  <details>
    <summary>Publishing Settings</summary>
    <div class="settings">
      <label>
        GitHub owner
        <input id="ghOwner" type="text" autocomplete="off" placeholder="your-username" />
      </label>
      <label>
        Repository
        <input id="ghRepo" type="text" autocomplete="off" placeholder="photo-grid" />
      </label>
      <label>
        Branch
        <input id="ghBranch" type="text" autocomplete="off" value="main" />
      </label>
      <label>
        GitHub token
        <input id="ghToken" type="password" autocomplete="off" placeholder="fine-grained token" />
      </label>
      <div class="setting-actions">
        <button id="saveSettingsBtn">Save Settings</button>
        <button id="loadPublishedBtn">Load Published</button>
      </div>
    </div>
  </details>

  <div class="grid-shell">
    <div id="grid" aria-label="20 by 20 photo grid"></div>
  </div>
  <div class="status" id="status">0 / 400 squares filled</div>
  <div class="hint">
    Edits auto-save in this browser. With publishing settings saved, changes also publish to the view-only site.
  </div>
</main>

<input id="filePicker" type="file" accept="image/*" />
<input id="backupPicker" type="file" accept=".json,application/json" />

<script>
(() => {
  const TOTAL = 400;
  const DB_NAME = 'photo-grid-400-site-db';
  const STORE = 'grid';
  const RECORD_KEY = 'layout-v1';
  const SETTINGS_KEY = 'publish-settings-v1';
  const DATA_PATH = 'grid-data.json';

  const grid = document.getElementById('grid');
  const filePicker = document.getElementById('filePicker');
  const backupPicker = document.getElementById('backupPicker');
  const status = document.getElementById('status');
  const clearBtn = document.getElementById('clearBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const publishBtn = document.getElementById('publishBtn');
  const loadPublishedBtn = document.getElementById('loadPublishedBtn');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const saveDot = document.getElementById('saveDot');
  const saveText = document.getElementById('saveText');
  const publishError = document.getElementById('publishError');
  const ghOwner = document.getElementById('ghOwner');
  const ghRepo = document.getElementById('ghRepo');
  const ghBranch = document.getElementById('ghBranch');
  const ghToken = document.getElementById('ghToken');

  const photos = new Array(TOTAL).fill(null);
  let selectedIndex = null;
  let dragSourceIndex = null;
  let db = null;
  let saveTimer = null;
  let publishTimer = null;
  let publishing = false;
  let pendingPublish = false;

  function setSaveState(text, state = '') {
    saveText.textContent = text;
    saveDot.className = 'save-dot' + (state ? ' ' + state : '');
  }

  function setPublishError(text = '') {
    publishError.textContent = text;
    publishError.classList.toggle('visible', Boolean(text));
  }

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const database = req.result;
        if (!database.objectStoreNames.contains(STORE)) database.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbGet(key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function payload() {
    return {
      version: 1,
      updatedAt: new Date().toISOString(),
      photos: photos.slice()
    };
  }

  async function publishPayload() {
    const compactPhotos = [];
    for (let i = 0; i < TOTAL; i++) {
      compactPhotos[i] = photos[i] ? await compactDataURL(photos[i]) : null;
    }
    return {
      version: 1,
      updatedAt: new Date().toISOString(),
      photos: compactPhotos
    };
  }

  async function saveNow() {
    if (!db) return;
    clearTimeout(saveTimer);
    setSaveState('Saving locally...', 'saving');
    try {
      await dbPut(RECORD_KEY, payload());
      setSaveState('Saved locally', 'saved');
      schedulePublish();
    } catch (err) {
      console.error(err);
      setSaveState('Could not save locally. Export a backup.', 'error');
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    setSaveState('Saving locally...', 'saving');
    saveTimer = setTimeout(saveNow, 250);
  }

  function updateStatus() {
    const filled = photos.filter(Boolean).length;
    status.textContent = `${filled} / ${TOTAL} squares filled`;
  }

  function renderCell(index) {
    const cell = grid.children[index];
    if (!cell) return;

    const existingImg = cell.querySelector('img');
    if (existingImg) existingImg.remove();

    if (photos[index]) {
      const img = document.createElement('img');
      img.src = photos[index];
      img.alt = `Photo in square ${index + 1}`;
      cell.prepend(img);
      cell.classList.add('filled');
      cell.draggable = true;
    } else {
      cell.classList.remove('filled');
      cell.draggable = false;
    }
  }

  function renderAll() {
    for (let i = 0; i < TOTAL; i++) renderCell(i);
    updateStatus();
  }

  function setPhoto(index, dataUrl) {
    photos[index] = dataUrl;
    renderCell(index);
    updateStatus();
    scheduleSave();
  }

  function removePhoto(index) {
    photos[index] = null;
    renderCell(index);
    updateStatus();
    scheduleSave();
  }

  function fileToOptimizedDataURL(file, maxSize = 520, quality = 0.78) {
  function optimizeImageSource(src, maxSize = 420, quality = 0.72) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read image'));
        img.onload = () => {
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read image'));
      img.onload = () => {
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = src;
    });
  }

          const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          const result = type === 'image/png' ? canvas.toDataURL(type) : canvas.toDataURL(type, quality);
          resolve(result);
        };
        img.src = reader.result;
  function compactDataURL(src) {
    if (!src || !src.startsWith('data:image/')) return Promise.resolve(src);
    return optimizeImageSource(src, 420, 0.72);
  }

  function fileToOptimizedDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = async () => {
        try {
          resolve(await optimizeImageSource(reader.result, 520, 0.78));
        } catch (err) {
          reject(err);
        }
      };
      reader.readAsDataURL(file);
    });
  }

  async function readImageFile(file, index) {
    if (!file || !file.type.startsWith('image/')) return;
    try {
      setSaveState('Preparing image...', 'saving');
      const dataUrl = await fileToOptimizedDataURL(file);
      setPhoto(index, dataUrl);
    } catch (err) {
      console.error(err);
      alert('That image could not be added.');
    }
  }

  function settings() {
    return {
      owner: ghOwner.value.trim(),
      repo: ghRepo.value.trim(),
      branch: ghBranch.value.trim() || 'main',
      token: ghToken.value.trim()
    };
  }

  function hasPublishSettings() {
    const s = settings();
    return Boolean(s.owner && s.repo && s.branch && s.token);
  }

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings()));
    setSaveState('Publishing settings saved', 'saved');
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      ghOwner.value = saved.owner || '';
      ghRepo.value = saved.repo || '';
      ghBranch.value = saved.branch || 'main';
      ghToken.value = saved.token || '';
    } catch (err) {
      console.error(err);
    }
  }

  function encodeBase64Unicode(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = '';
    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
    return btoa(binary);
  }

  async function githubRequest(url, options = {}) {
    const s = settings();
    const res = await fetch(url, {
      ...options,
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: `Bearer ${s.token}`,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(options.headers || {})
      }
    });

    if (!res.ok) {
      const text = await res.text();
      let message = text;
      try {
        const parsed = JSON.parse(text);
        message = parsed.message || text;
      } catch (_) {}

      if (res.status === 401) {
        message = 'GitHub says the token is invalid or expired. Make a new fine-grained token and paste it into Publishing Settings.';
      } else if (res.status === 403) {
        message = 'GitHub says the token does not have permission. The token needs Contents: Read and write for this repository.';
      } else if (res.status === 404) {
        message = 'GitHub could not find that owner/repository/branch, or the token cannot access it. Check spelling and token repository access.';
      } else if (res.status === 409 || res.status === 422) {
        message = parsedMessageForConflict(message);
      }

      throw new Error(message);
    }
    return res.json();
  }

  function parsedMessageForConflict(message) {
    if (String(message).toLowerCase().includes('sha')) {
      return 'GitHub has a newer copy of grid-data.json. Click Publish Now again; the editor will refresh the file version and retry.';
    }
    return 'GitHub rejected the update. The data may be too large, or the branch/file state changed.';
    return `GitHub rejected the update: ${message}`;
  }

  async function getCurrentSha() {
    const s = settings();
    const url = `https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/contents/${DATA_PATH}?ref=${encodeURIComponent(s.branch)}`;
    try {
      const data = await githubRequest(url);
      return data.sha || null;
    } catch (err) {
      if (String(err.message).includes('(404)')) return null;
      throw err;
    }
  }

  async function putGridData(content) {
    const s = settings();
    const sha = await getCurrentSha();
    const body = {
      message: 'Update photo grid',
      content: encodeBase64Unicode(content),
      branch: s.branch
    };
    if (sha) body.sha = sha;

    const url = `https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/contents/${DATA_PATH}`;
    return githubRequest(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  async function publishNow() {
    if (!hasPublishSettings()) {
      setSaveState('Add GitHub publishing settings to publish online.', 'error');
      setPublishError('Open Publishing Settings and fill in owner, repository, branch, and token.');
      return;
    }

    if (publishing) {
      pendingPublish = true;
      return;
    }

    publishing = true;
    pendingPublish = false;
    setSaveState('Publishing to website...', 'saving');
    setPublishError('');

    try {
      setSaveState('Preparing smaller website data...', 'saving');
      const content = JSON.stringify(payload(), null, 2);
      const content = JSON.stringify(await publishPayload(), null, 2);
      try {
        await putGridData(content);
      } catch (err) {
        if (!String(err.message).toLowerCase().includes('sha')) throw err;
        setSaveState('Refreshing GitHub file version...', 'saving');
        await putGridData(content);
      }

      setSaveState('Saved locally and published online', 'saved');
    } catch (err) {
      console.error(err);
      setSaveState('Saved locally. Online publish failed.', 'error');
      setPublishError(err.message || 'Unknown publish error.');
    } finally {
      publishing = false;
      if (pendingPublish) publishNow();
    }
  }

  function schedulePublish() {
    clearTimeout(publishTimer);
    if (!hasPublishSettings()) return;
    publishTimer = setTimeout(publishNow, 1200);
  }

  async function loadPublished() {
    if (!hasPublishSettings()) {
      setSaveState('Add GitHub publishing settings first.', 'error');
      return;
    }

    try {
      setSaveState('Loading published grid...', 'saving');
      const s = settings();
      const url = `https://raw.githubusercontent.com/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/${encodeURIComponent(s.branch)}/${DATA_PATH}?v=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Could not load published grid (${res.status})`);
      const data = await res.json();
      if (!data || !Array.isArray(data.photos)) throw new Error('Invalid published grid');

      for (let i = 0; i < TOTAL; i++) photos[i] = data.photos[i] || null;
      renderAll();
      await saveNow();
      setSaveState('Loaded published grid', 'saved');
    } catch (err) {
      console.error(err);
      setSaveState('Could not load published grid.', 'error');
    }
  }

  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.title = `Square ${i + 1}`;

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.textContent = '+';

    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.type = 'button';
    remove.textContent = 'x';
    remove.title = 'Remove photo';
    remove.setAttribute('aria-label', `Remove photo from square ${i + 1}`);

    cell.appendChild(placeholder);
    cell.appendChild(remove);

    cell.addEventListener('click', (e) => {
      if (e.target.closest('.remove')) return;
      selectedIndex = i;
      filePicker.value = '';
      filePicker.click();
    });

    remove.addEventListener('click', (e) => {
      e.stopPropagation();
      removePhoto(i);
    });

    cell.addEventListener('dragstart', (e) => {
      if (!photos[i]) {
        e.preventDefault();
        return;
      }
      dragSourceIndex = i;
      cell.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
    });

    cell.addEventListener('dragend', () => {
      cell.classList.remove('dragging');
      [...grid.children].forEach(c => c.classList.remove('drag-over'));
      dragSourceIndex = null;
    });

    cell.addEventListener('dragover', (e) => {
      e.preventDefault();
      cell.classList.add('drag-over');
    });

    cell.addEventListener('dragleave', () => {
      cell.classList.remove('drag-over');
    });

    cell.addEventListener('drop', async (e) => {
      e.preventDefault();
      cell.classList.remove('drag-over');

      const droppedFile = e.dataTransfer.files && e.dataTransfer.files[0];
      if (droppedFile && droppedFile.type.startsWith('image/')) {
        await readImageFile(droppedFile, i);
        return;
      }

      let source = dragSourceIndex;
      const raw = e.dataTransfer.getData('text/plain');
      if (raw !== '') source = Number(raw);
      if (!Number.isInteger(source) || source < 0 || source >= TOTAL || source === i) return;

      const temp = photos[i];
      photos[i] = photos[source];
      photos[source] = temp;

      renderCell(source);
      renderCell(i);
      updateStatus();
      scheduleSave();
    });

    grid.appendChild(cell);
  }

  filePicker.addEventListener('change', async () => {
    const file = filePicker.files && filePicker.files[0];
    if (selectedIndex === null || !file) return;
    await readImageFile(file, selectedIndex);
  });

  clearBtn.addEventListener('click', async () => {
    if (!confirm('Remove all photos from the grid? This will also update the saved version.')) return;
    photos.fill(null);
    renderAll();
    await saveNow();
  });

  exportBtn.addEventListener('click', () => {
    const backup = {
      app: '400-photo-grid',
      version: 1,
      exportedAt: new Date().toISOString(),
      photos
    };

    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `photo-grid-backup-${date}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  importBtn.addEventListener('click', () => {
    backupPicker.value = '';
    backupPicker.click();
  });

  backupPicker.addEventListener('change', async () => {
    const file = backupPicker.files && backupPicker.files[0];
    if (!file) return;

    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.photos)) throw new Error('Invalid backup');

      for (let i = 0; i < TOTAL; i++) photos[i] = data.photos[i] || null;
      renderAll();
      await saveNow();
      alert('Backup imported successfully.');
    } catch (err) {
      console.error(err);
      alert('That file is not a valid photo-grid backup.');
    }
  });

  saveSettingsBtn.addEventListener('click', saveSettings);
  publishBtn.addEventListener('click', publishNow);
  loadPublishedBtn.addEventListener('click', loadPublished);

  async function boot() {
    loadSettings();

    if (!('indexedDB' in window)) {
      setSaveState('Auto-save unavailable in this browser. Use Export Backup.', 'error');
      return;
    }

    try {
      db = await openDB();
      const saved = await dbGet(RECORD_KEY);

      if (saved && Array.isArray(saved.photos)) {
        for (let i = 0; i < TOTAL; i++) photos[i] = saved.photos[i] || null;
        renderAll();
      }

      setSaveState('Saved locally', 'saved');

      if (navigator.storage && navigator.storage.persist) {
        try { await navigator.storage.persist(); } catch (_) {}
      }
    } catch (err) {
      console.error(err);
      setSaveState('Could not open saved storage. Use Export Backup.', 'error');
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && saveTimer) saveNow();
  });

  boot();
})();
</script>
</body>
</html>
